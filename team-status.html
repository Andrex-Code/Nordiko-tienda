<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Oficina - Equipo NØRDIKO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-office: #1a1a1a;
            --bg-desk: #2a2a2a;
            --bg-wall: #111111;
            --gold: #c9a96e;
            --gold-dark: #b8860b;
            --text: #f5f5f5;
            --text-muted: #888;
            --success: #4caf50;
            --warning: #ff9800;
            --error: #e53935;
            --info: #2196f3;
            --purple: #9c27b0;
            --cyan: #00bcd4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== OFICINA LAYOUT ===== */
        .office {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
        }

        /* ===== HEADER / RECEPCIÓN ===== */
        .office-header {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }

        .office-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .office-logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--bg-dark);
        }

        .office-logo-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--gold);
        }

        .office-logo-text p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .office-stats {
            display: flex;
            gap: 30px;
        }

        .office-stat {
            text-align: center;
        }

        .office-stat .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
        }

        .office-stat .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ===== SIDEBAR / PASILLO ===== */
        .office-corridor {
            background: var(--bg-wall);
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }

        .corridor-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .room {
            background: var(--bg-desk);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .room:hover, .room.active {
            border-color: var(--gold);
            background: var(--bg-office);
        }

        .room-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .room-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .room-icon.design { background: rgba(156, 39, 176, 0.2); color: var(--purple); }
        .room-icon.dev { background: rgba(33, 150, 243, 0.2); color: var(--info); }
        .room-icon.qa { background: rgba(255, 152, 0, 0.2); color: var(--warning); }
        .room-icon.deploy { background: rgba(76, 175, 80, 0.2); color: var(--success); }

        .room-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .room-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-dark);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .room-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .room-agent {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: var(--bg-dark);
            border-radius: 10px;
            color: var(--text-muted);
        }

        .room-agent.active {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning);
        }

        /* ===== MAIN / ESPACIO DE TRABAJO ===== */
        .office-main {
            padding: 30px;
            overflow-y: auto;
            background: linear-gradient(180deg, var(--bg-dark) 0%, #0d0d0d 100%);
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-office);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(201, 169, 110, 0.1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .stat-card.gold::before { background: var(--gold); }
        .stat-card.green::before { background: var(--success); }
        .stat-card.orange::before { background: var(--warning); }
        .stat-card.blue::before { background: var(--info); }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .stat-card.gold .stat-icon { background: rgba(201, 169, 110, 0.15); color: var(--gold); }
        .stat-card.green .stat-icon { background: rgba(76, 175, 80, 0.15); color: var(--success); }
        .stat-card.orange .stat-icon { background: rgba(255, 152, 0, 0.15); color: var(--warning); }
        .stat-card.blue .stat-icon { background: rgba(33, 150, 243, 0.15); color: var(--info); }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Agentes Grid */
        .agents-section {
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--gold);
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Agente Card - Escritorio */
        .agent-desk {
            background: var(--bg-office);
            border-radius: 16px;
            border: 1px solid #333;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .agent-desk:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .desk-surface {
            padding: 20px;
            position: relative;
        }

        /* Barra de estado del escritorio */
        .desk-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-wall);
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .desk-light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .desk-light.on { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .desk-light.working { background: var(--warning); box-shadow: 0 0 10px var(--warning); animation: blink 1s infinite; }
        .desk-light.off { background: var(--text-muted); }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .desk-status-text {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Monitor del agente */
        .desk-monitor {
            background: var(--bg-wall);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .monitor-screen {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            line-height: 1.6;
        }

        .monitor-line {
            display: flex;
            gap: 8px;
        }

        .monitor-prompt {
            color: var(--success);
        }

        .monitor-command {
            color: var(--text);
        }

        .monitor-output {
            color: var(--text-muted);
        }

        .monitor-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--gold);
            animation: cursor-blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes cursor-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Info del agente */
        .agent-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--bg-dark);
        }

        .agent-details h4 {
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .agent-details p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Output del agente */
        .agent-output {
            background: var(--bg-wall);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.75rem;
        }

        .output-label {
            color: var(--gold);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .output-text {
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Refresh */
        .refresh-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-office);
            border: 1px solid var(--gold);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .refresh-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .office { grid-template-columns: 1fr; }
            .office-corridor { display: none; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr; }
            .agents-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="office">
        <!-- Header / Recepción -->
        <header class="office-header">
            <div class="office-logo">
                <div class="office-logo-icon">
                    <i class="fas fa-mountain"></i>
                </div>
                <div class="office-logo-text">
                    <h1>NØRDIKO</h1>
                    <p>Oficina del Equipo</p>
                </div>
            </div>
            <div class="office-stats">
                <div class="office-stat">
                    <div class="number" id="statTotal">0</div>
                    <div class="label">Agentes</div>
                </div>
                <div class="office-stat">
                    <div class="number" id="statActive" style="color: var(--warning)">0</div>
                    <div class="label">Activos</div>
                </div>
                <div class="office-stat">
                    <div class="number" id="statDone" style="color: var(--success)">0</div>
                    <div class="label">Completados</div>
                </div>
            </div>
        </header>

        <!-- Sidebar / Pasillo -->
        <aside class="office-corridor">
            <div class="corridor-title">Departamentos</div>
            <div class="room-list" id="roomList">
                <!-- Cargado por JS -->
            </div>
        </aside>

        <!-- Main / Espacio de Trabajo -->
        <main class="office-main">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card gold">
                    <div class="stat-icon"><i class="fas fa-users"></i></div>
                    <div class="stat-number" id="cardTotal">0</div>
                    <div class="stat-label">Total Agentes</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-number" id="cardDone">0</div>
                    <div class="stat-label">Tareas Completadas</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-icon"><i class="fas fa-spinner fa-spin"></i></div>
                    <div class="stat-number" id="cardActive">0</div>
                    <div class="stat-label">Trabajando Ahora</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-icon"><i class="fas fa-handshake"></i></div>
                    <div class="stat-number" id="cardCollabs">0</div>
                    <div class="stat-label">Colaboraciones</div>
                </div>
            </div>

            <!-- Agentes -->
            <div class="agents-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <i class="fas fa-desktop"></i>
                        Escritorios del Equipo
                    </h2>
                    <span style="color: var(--text-muted); font-size: 0.85rem;">
                        <i class="fas fa-sync-alt"></i> Actualización automática
                    </span>
                </div>
                <div class="agents-grid" id="agentsGrid">
                    <!-- Cargado por JS -->
                </div>
            </div>
        </main>
    </div>

    <div class="refresh-badge">
        <div class="refresh-dot"></div>
        <span>En vivo - Actualización cada 5s</span>
    </div>

    <script>
        async function loadTeamData() {
            try {
                const response = await fetch('team-brain.json?t=' + Date.now());
                const data = await response.json();
                renderOffice(data);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderOffice(data) {
            const agents = data.agentes || [];
            const completed = agents.filter(a => a.estado === 'completado');
            const active = agents.filter(a => a.estado === 'trabajando');

            // Stats
            animateNumber('statTotal', agents.length);
            animateNumber('statActive', active.length);
            animateNumber('statDone', completed.length);
            animateNumber('cardTotal', agents.length);
            animateNumber('cardDone', completed.length);
            animateNumber('cardActive', active.length);

            // Contar colaboraciones
            const collabs = new Set();
            agents.forEach(a => {
                agents.forEach(b => {
                    if (a.id !== b.id && a.archivo && b.archivo && a.archivo === b.archivo) {
                        collabs.add(`${a.id}-${b.id}`);
                    }
                });
            });
            animateNumber('cardCollabs', collabs.size);

            // Rooms (departamentos)
            const rooms = [
                { id: 'design', name: 'Diseño', icon: 'fa-paint-brush', class: 'design', agents: agents.filter(a => ['css-designer', 'brand-manager', 'niche-specialist'].includes(a.id)) },
                { id: 'dev', name: 'Desarrollo', icon: 'fa-code', class: 'dev', agents: agents.filter(a => ['html-developer', 'js-developer', 'mobile-store', 'devops', 'categorias-admin', 'recomendaciones-consultor'].includes(a.id)) },
                { id: 'qa', name: 'Control de Calidad', icon: 'fa-bug', class: 'qa', agents: agents.filter(a => ['revision-codigo', 'revision-ux', 'revision-seguridad', 'revision-responsive', 'revision-temas', 'mejoras-temas'].includes(a.id)) },
                { id: 'ops', name: 'Operaciones', icon: 'fa-rocket', class: 'deploy', agents: agents.filter(a => a.id === 'devops-despliegue') }
            ];

            document.getElementById('roomList').innerHTML = rooms.map(room => `
                <div class="room">
                    <div class="room-header">
                        <div class="room-icon ${room.class}">
                            <i class="fas ${room.icon}"></i>
                        </div>
                        <span class="room-name">${room.name}</span>
                        <span class="room-count">${room.agents.length}</span>
                    </div>
                    <div class="room-agents">
                        ${room.agents.map(a => `
                            <span class="room-agent ${a.estado === 'trabajando' ? 'active' : ''}">
                                ${a.nombre}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Agent desks
            document.getElementById('agentsGrid').innerHTML = agents.map(agent => {
                const isActive = agent.estado === 'trabajando';
                const initials = agent.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                
                // Generar líneas de código simuladas
                const codeLines = generateCodeLines(agent);
                
                return `
                    <div class="agent-desk">
                        <div class="desk-surface">
                            <div class="desk-status-bar">
                                <div class="desk-light ${isActive ? 'working' : 'on'}"></div>
                                <span class="desk-status-text">
                                    ${isActive ? 'Trabajando...' : 'Tarea completada'}
                                </span>
                            </div>
                            <div class="desk-monitor">
                                <div class="monitor-screen">
                                    ${codeLines}
                                    ${isActive ? '<span class="monitor-cursor"></span>' : ''}
                                </div>
                            </div>
                            <div class="agent-info-row">
                                <div class="agent-avatar">${initials}</div>
                                <div class="agent-details">
                                    <h4>${agent.nombre}</h4>
                                    <p>${agent.tarea}</p>
                                </div>
                            </div>
                            ${agent.resultado ? `
                            <div class="agent-output">
                                <div class="output-label">Resultado</div>
                                <div class="output-text">${agent.resultado}</div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function generateCodeLines(agent) {
            const lines = [];
            const task = agent.tarea.toLowerCase();
            
            if (agent.estado === 'trabajando') {
                lines.push('<div class="monitor-line"><span class="monitor-prompt">$</span> <span class="monitor-command">trabajando en ${agent.tarea}...</span></div>');
                lines.push('<div class="monitor-line"><span class="monitor-output">→ Procesando...</span></div>');
                lines.push('<div class="monitor-line"><span class="monitor-output">→ Aplicando cambios...</span></div>');
            } else {
                lines.push('<div class="monitor-line"><span class="monitor-prompt">$</span> <span class="monitor-command">${agent.nombre}</span></div>');
                lines.push('<div class="monitor-line"><span class="monitor-output">✓ Tarea completada</span></div>');
                if (agent.resultado) {
                    lines.push('<div class="monitor-line"><span class="monitor-output">→ ${agent.resultado.substring(0, 60)}...</span></div>');
                }
                lines.push('<div class="monitor-line"><span class="monitor-output">✓ Listo para producción</span></div>');
            }
            
            return lines.join('');
        }

        function animateNumber(id, target) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = parseInt(el.textContent) || 0;
            const duration = 800;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = Math.floor(start + (target - start) * progress);
                el.textContent = current;
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        loadTeamData();
        setInterval(loadTeamData, 5000);
    </script>
</body>
</html>
