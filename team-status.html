<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina 3D - Equipo NØRDIKO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== 3D SCENE ===== */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 1500px;
            perspective-origin: 50% 30%;
            position: relative;
            overflow: hidden;
        }

        .office-floor {
            position: absolute;
            width: 200%;
            height: 200%;
            left: -50%;
            top: 50%;
            background: 
                linear-gradient(90deg, rgba(201,169,110,0.03) 1px, transparent 1px),
                linear-gradient(rgba(201,169,110,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(75deg);
            transform-style: preserve-3d;
        }

        .office-walls {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a0a 0%, #111 50%, #0a0a0a 100%);
        }

        /* ===== ROOMS / DEPARTAMENTOS ===== */
        .department {
            position: absolute;
            width: 280px;
            height: 200px;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .department:hover {
            transform: translateZ(20px);
        }

        .department:hover .room-glow {
            opacity: 1;
        }

        .room-glow {
            position: absolute;
            inset: -20px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .room-glow.design { background: radial-gradient(ellipse, rgba(156,39,176,0.15) 0%, transparent 70%); }
        .room-glow.dev { background: radial-gradient(ellipse, rgba(33,150,243,0.15) 0%, transparent 70%); }
        .room-glow.qa { background: radial-gradient(ellipse, rgba(255,152,0,0.15) 0%, transparent 70%); }
        .room-glow.ops { background: radial-gradient(ellipse, rgba(76,175,80,0.15) 0%, transparent 70%); }

        /* ===== ROOM STRUCTURE ===== */
        .room {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #111 100%);
            border-radius: 16px;
            border: 2px solid #333;
            padding: 20px;
            transform-style: preserve-3d;
        }

        .room-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .room-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .room-icon.design { background: rgba(156,39,176,0.2); color: #9c27b0; }
        .room-icon.dev { background: rgba(33,150,243,0.2); color: #2196f3; }
        .room-icon.qa { background: rgba(255,152,0,0.2); color: #ff9800; }
        .room-icon.ops { background: rgba(76,175,80,0.2); color: #4caf50; }

        .room-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .room-count {
            margin-left: auto;
            font-size: 0.75rem;
            color: #888;
            background: #0a0a0a;
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* ===== AGENTS IN ROOM ===== */
        .agents-in-room {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ===== AGENT PERSONITA ===== */
        .agent-person {
            width: 50px;
            height: 70px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .agent-person:hover {
            transform: translateY(-5px) scale(1.1);
            z-index: 10;
        }

        .agent-person:hover .agent-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Cabeza */
        .agent-head {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .agent-head.design { background: linear-gradient(135deg, #9c27b0, #7b1fa2); }
        .agent-head.dev { background: linear-gradient(135deg, #2196f3, #1976d2); }
        .agent-head.qa { background: linear-gradient(135deg, #ff9800, #f57c00); }
        .agent-head.ops { background: linear-gradient(135deg, #4caf50, #388e3c); }

        /* Ojos */
        .agent-head::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 7px;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 11px 0 0 #fff;
        }

        /* Sonrisa */
        .agent-head::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 5px;
            border: 2px solid #fff;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }

        /* Cuerpo */
        .agent-body {
            width: 35px;
            height: 35px;
            margin: -5px auto 0;
            border-radius: 8px 8px 4px 4px;
            position: relative;
        }

        .agent-body.design { background: linear-gradient(135deg, #7b1fa2, #4a148c); }
        .agent-body.dev { background: linear-gradient(135deg, #1976d2, #0d47a1); }
        .agent-body.qa { background: linear-gradient(135deg, #f57c00, #e65100); }
        .agent-body.ops { background: linear-gradient(135deg, #388e3c, #1b5e20); }

        /* Estado de trabajo */
        .agent-working {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            border: 2px solid #0a0a0a;
            animation: pulse 1s infinite;
        }

        .agent-working.active {
            background: #ff9800;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        /* Tooltip */
        .agent-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tooltip-title {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #c9a96e;
        }

        .tooltip-task {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        .tooltip-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .tooltip-status.working {
            background: rgba(255,152,0,0.2);
            color: #ff9800;
        }

        .tooltip-status.completed {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
        }

        /* ===== MODAL DETALLE ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #333;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-avatar.design { background: linear-gradient(135deg, #9c27b0, #7b1fa2); }
        .modal-avatar.dev { background: linear-gradient(135deg, #2196f3, #1976d2); }
        .modal-avatar.qa { background: linear-gradient(135deg, #ff9800, #f57c00); }
        .modal-avatar.ops { background: linear-gradient(135deg, #4caf50, #388e3c); }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .modal-close {
            margin-left: auto;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #333;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .modal-value {
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: #c9a96e;
            color: #0a0a0a;
        }

        .modal-btn.secondary {
            background: #333;
            color: #fff;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26,26,26,0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 15px 30px;
            display: flex;
            gap: 30px;
            border: 1px solid #333;
            z-index: 100;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #c9a96e;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        /* ===== REFRESH ===== */
        .refresh-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(26,26,26,0.9);
            border: 1px solid #c9a96e;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #c9a96e;
            z-index: 100;
        }

        .refresh-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* Posiciones de departamentos */
        .dept-design { top: 15%; left: 5%; }
        .dept-dev { top: 15%; left: 38%; }
        .dept-qa { top: 55%; left: 5%; }
        .dept-ops { top: 55%; left: 38%; }

        @media (max-width: 1200px) {
            .dept-design { top: 10%; left: 2%; }
            .dept-dev { top: 10%; left: 52%; }
            .dept-qa { top: 50%; left: 2%; }
            .dept-ops { top: 50%; left: 52%; }
        }
    </style>
</head>
<body>
    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Agentes</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statActive" style="color: #ff9800">0</div>
            <div class="stat-label">Activos</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statDone" style="color: #4caf50">0</div>
            <div class="stat-label">Completados</div>
        </div>
    </div>

    <!-- 3D Scene -->
    <div class="scene" id="scene">
        <div class="office-walls"></div>
        <div class="office-floor"></div>
        <!-- Departamentos se generan por JS -->
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-avatar" id="modalAvatar">A</div>
                <div>
                    <div class="modal-title" id="modalTitle">Agente</div>
                    <div class="modal-subtitle" id="modalSubtitle">Tarea</div>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-label">Estado</div>
                <div class="modal-value" id="modalStatus">Trabajando</div>
                <div class="modal-label">Progreso</div>
                <div class="modal-value" id="modalProgress">0%</div>
                <div class="modal-label">Resultado</div>
                <div class="modal-value" id="modalResult">-</div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn secondary" onclick="closeModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="refresh-indicator">
        <div class="refresh-dot"></div>
        <span>En vivo</span>
    </div>

    <script>
        async function loadTeamData() {
            try {
                const response = await fetch('team-brain.json?t=' + Date.now());
                const data = await response.json();
                renderOffice(data);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderOffice(data) {
            const agents = data.agentes || [];
            const completed = agents.filter(a => a.estado === 'completado');
            const active = agents.filter(a => a.estado === 'trabajando');

            document.getElementById('statTotal').textContent = agents.length;
            document.getElementById('statActive').textContent = active.length;
            document.getElementById('statDone').textContent = completed.length;

            // Organizar por departamentos
            const departments = [
                { id: 'design', name: 'Diseño', icon: 'fa-paint-brush', class: 'design', agents: agents.filter(a => ['css-designer', 'brand-manager', 'niche-specialist'].includes(a.id)) },
                { id: 'dev', name: 'Desarrollo', icon: 'fa-code', class: 'dev', agents: agents.filter(a => ['html-developer', 'js-developer', 'mobile-store', 'devops', 'categorias-admin', 'recomendaciones-consultor', 'fix-inittemas', 'fix-categorias-contador', 'fix-temas-colores'].includes(a.id)) },
                { id: 'qa', name: 'Control de Calidad', icon: 'fa-bug', class: 'qa', agents: agents.filter(a => ['revision-codigo', 'revision-ux', 'revision-seguridad', 'revision-responsive', 'revision-temas', 'mejoras-temas'].includes(a.id)) },
                { id: 'ops', name: 'Operaciones', icon: 'fa-rocket', class: 'ops', agents: agents.filter(a => a.id === 'devops-despliegue') }
            ];

            const scene = document.getElementById('scene');
            // Limpiar departamentos anteriores
            scene.querySelectorAll('.department').forEach(d => d.remove());

            departments.forEach((dept, index) => {
                const deptEl = document.createElement('div');
                deptEl.className = `department dept-${dept.id}`;
                
                const agentsHtml = dept.agents.map(agent => {
                    const isActive = agent.estado === 'trabajando';
                    const initials = agent.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    
                    return `
                        <div class="agent-person" onclick="showAgentDetail('${agent.id}')" data-agent-id="${agent.id}">
                            <div class="agent-working ${isActive ? 'active' : ''}"></div>
                            <div class="agent-head ${dept.class}"></div>
                            <div class="agent-body ${dept.class}"></div>
                            <div class="agent-tooltip">
                                <div class="tooltip-title">${agent.nombre}</div>
                                <div class="tooltip-task">${agent.tarea}</div>
                                <span class="tooltip-status ${isActive ? 'working' : 'completed'}">
                                    ${isActive ? 'Trabajando' : 'Completado'}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');

                deptEl.innerHTML = `
                    <div class="room-glow ${dept.class}"></div>
                    <div class="room">
                        <div class="room-header">
                            <div class="room-icon ${dept.class}">
                                <i class="fas ${dept.icon}"></i>
                            </div>
                            <span class="room-title">${dept.name}</span>
                            <span class="room-count">${dept.agents.length}</span>
                        </div>
                        <div class="agents-in-room">
                            ${agentsHtml}
                        </div>
                    </div>
                `;

                scene.appendChild(deptEl);
            });
        }

        function showAgentDetail(agentId) {
            fetch('team-brain.json?t=' + Date.now())
                .then(r => r.json())
                .then(data => {
                    const agent = data.agentes.find(a => a.id === agentId);
                    if (!agent) return;

                    const isActive = agent.estado === 'trabajando';
                    const initials = agent.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    
                    // Determinar clase de color
                    let cls = 'dev';
                    if (agent.id.startsWith('css') || agent.id.startsWith('brand')) cls = 'design';
                    else if (agent.id.startsWith('revision') || agent.id === 'mejoras-temas') cls = 'qa';
                    else if (agent.id === 'devops-despliegue') cls = 'ops';

                    document.getElementById('modalAvatar').textContent = initials;
                    document.getElementById('modalAvatar').className = `modal-avatar ${cls}`;
                    document.getElementById('modalTitle').textContent = agent.nombre;
                    document.getElementById('modalSubtitle').textContent = agent.tarea;
                    document.getElementById('modalStatus').textContent = isActive ? 'Trabajando ahora' : 'Completado';
                    document.getElementById('modalProgress').textContent = (agent.progreso || 0) + '%';
                    document.getElementById('modalResult').textContent = agent.resultado || 'En progreso...';

                    document.getElementById('modalOverlay').classList.add('active');
                });
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        // Cerrar con Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadTeamData();
        setInterval(loadTeamData, 5000);
    </script>
</body>
</html>
